{% extends 'base.html' %}
{% block content %}
<div class="gradient-navy py-16"><div class="max-w-7xl mx-auto px-4 text-center text-white"><h1 class="text-4xl font-bold mb-2">Gallery</h1><p class="text-gray-300">Moments from our campus life</p></div></div>
<div class="max-w-7xl mx-auto px-4 py-12">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for album in albums %}
    <a href="/gallery/{{ album.slug }}/" class="group card-hover rounded-2xl overflow-hidden shadow-md relative aspect-video">
      {% if album.cover_image %}<img src="{{ album.cover_image.url }}" alt="{{ album.title }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" loading="lazy">{% else %}<div class="w-full h-full gradient-navy flex items-center justify-center"><i class="fas fa-images text-white opacity-20 text-6xl"></i></div>{% endif %}
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent group-hover:from-navy-900 transition-all duration-300"></div>
      <div class="absolute bottom-0 left-0 right-0 p-5"><h3 class="text-white font-bold text-lg">{{ album.title }}</h3><p class="text-gray-300 text-sm flex items-center gap-2"><i class="fas fa-images text-yellow-300"></i> {{ album.item_count }} photos</p></div>
    </a>
    {% empty %}<div class="col-span-3 text-center py-16 text-gray-400"><i class="fas fa-images text-5xl mb-4 block"></i><p>No albums available yet.</p></div>{% endfor %}
  </div>
</div>
{% endblock %}
