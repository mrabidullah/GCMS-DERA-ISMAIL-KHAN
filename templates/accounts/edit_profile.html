{% extends 'base.html' %}
{% block content %}
<div class="gradient-navy py-12"><div class="max-w-7xl mx-auto px-4"><h1 class="text-3xl font-bold text-white">Edit Profile</h1></div></div>
<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="bg-white rounded-2xl shadow-md p-8">
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Profile Picture</label>
          <input type="file" name="profile_picture" accept="image/*" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Phone</label>
          <input type="tel" name="phone" value="{{ user.phone }}" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
          <input type="text" name="address" value="{{ user.address }}" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none">
        </div>
        {% if teacher_profile %}
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">Qualification</label><input type="text" name="qualification" value="{{ teacher_profile.qualification }}" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none"></div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">Office Hours</label><input type="text" name="office_hours" value="{{ teacher_profile.office_hours }}" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none"></div>
        <div class="sm:col-span-2"><label class="block text-sm font-semibold text-gray-700 mb-2">Biography</label><textarea name="biography" rows="4" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none">{{ teacher_profile.biography }}</textarea></div>
        {% endif %}
      </div>
      <button type="submit" class="px-8 py-3 gradient-navy text-white font-semibold rounded-xl hover:opacity-90 transition"><i class="fas fa-save mr-2"></i> Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
