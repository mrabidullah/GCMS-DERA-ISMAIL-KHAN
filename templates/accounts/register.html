{% extends 'base.html' %}
{% block content %}
<div class="gradient-navy py-12">
  <div class="max-w-7xl mx-auto px-4 text-center text-white">
    <h1 class="text-4xl font-bold mb-2">Register</h1>
    <p class="text-gray-300">Create your GCMS account</p>
  </div>
</div>

<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
      {% csrf_token %}
      <!-- User Type Selection -->
      <div>
        <label class="block text-sm font-bold text-navy-800 mb-3 uppercase tracking-wide">Register As *</label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <label class="flex items-center gap-3 border-2 border-gray-200 rounded-xl p-4 cursor-pointer hover:border-navy-400 transition has-[:checked]:border-navy-600 has-[:checked]:bg-navy-50">
            <input type="radio" name="user_type" value="student" checked class="text-navy-600" onchange="switchUserType('student')">
            <div><div class="font-semibold text-navy-800 flex items-center gap-2"><i class="fas fa-user-graduate text-navy-600"></i> Student</div><div class="text-xs text-gray-500">For enrolled students</div></div>
          </label>
          <label class="flex items-center gap-3 border-2 border-gray-200 rounded-xl p-4 cursor-pointer hover:border-navy-400 transition has-[:checked]:border-navy-600 has-[:checked]:bg-navy-50">
            <input type="radio" name="user_type" value="teacher" class="text-navy-600" onchange="switchUserType('teacher')">
            <div><div class="font-semibold text-navy-800 flex items-center gap-2"><i class="fas fa-chalkboard-teacher text-navy-600"></i> Teacher</div><div class="text-xs text-gray-500">For teaching staff</div></div>
          </label>
        </div>
      </div>

      <!-- Common Fields -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Username *</label>
          <input type="text" name="username" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Choose a username">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
          <input type="email" name="email" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="your@email.com">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
          <input type="password" name="password" required minlength="8" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Min. 8 characters">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Mobile Number</label>
          <input type="tel" name="phone" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="+92 xxx xxxxxxx">
        </div>
      </div>

      <!-- Student Fields -->
      <div id="student-fields" class="space-y-4 transition-all">
        <h3 class="font-bold text-navy-800 flex items-center gap-2 border-b border-gray-100 pb-2"><i class="fas fa-user-graduate text-navy-600"></i> Student Information</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name *</label>
            <input type="text" name="student_name" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Your full name">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Roll Number</label>
            <input type="text" name="roll_number" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Registration Number</label>
            <input type="text" name="registration_number" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Father's Name</label>
            <input type="text" name="father_name" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">CNIC / B-Form</label>
            <input type="text" name="cnic" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="xxxxx-xxxxxxx-x">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
            <select name="department" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
              <option value="">Select Department</option>
              {% for dept in departments %}<option value="{{ dept.pk }}">{{ dept.name }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Semester</label>
            <select name="semester" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
              <option value="">Select Semester</option>
              {% for n in "12345678"|make_list %}<option value="{{ n }}st Semester">{{ n }} Semester</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Session</label>
            <input type="text" name="session" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="e.g. 2022–2026">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
            <textarea name="address" rows="2" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Your residential address"></textarea>
          </div>
        </div>
      </div>

      <!-- Teacher Fields -->
      <div id="teacher-fields" class="space-y-4 transition-all hidden">
        <h3 class="font-bold text-navy-800 flex items-center gap-2 border-b border-gray-100 pb-2"><i class="fas fa-chalkboard-teacher text-navy-600"></i> Teacher Information</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name *</label>
            <input type="text" name="teacher_name" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Your full name">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Employee ID</label>
            <input type="text" name="employee_id" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Qualification</label>
            <input type="text" name="qualification" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="e.g. M.Phil, PhD">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Designation</label>
            <input type="text" name="designation" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="e.g. Lecturer, Assistant Professor">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Department</label>
            <select name="teacher_department" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition">
              <option value="">Select Department</option>
              {% for dept in departments %}<option value="{{ dept.pk }}">{{ dept.name }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Experience</label>
            <input type="text" name="experience" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="e.g. 5 Years">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Specialization</label>
            <input type="text" name="specialization" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Area of expertise">
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-4 gradient-navy text-white font-bold rounded-xl hover:opacity-90 transition-all transform hover:-translate-y-0.5 shadow-lg">
        <i class="fas fa-user-plus mr-2"></i> Submit Registration Request
      </button>
      <p class="text-center text-sm text-gray-500"><i class="fas fa-info-circle mr-1 text-yellow-500"></i>Your account will be reviewed and activated by the administrator.</p>
    </form>
    <div class="border-t border-gray-100 mt-6 pt-4 text-center">
      <p class="text-sm text-gray-600">Already have an account? <a href="{% url 'login' %}" class="text-navy-600 font-semibold hover:text-navy-800 transition">Login Here</a></p>
    </div>
  </div>
</div>
<script>
function switchUserType(type) {
  const studentFields = document.getElementById('student-fields');
  const teacherFields = document.getElementById('teacher-fields');
  if(type === 'student') { studentFields.classList.remove('hidden'); teacherFields.classList.add('hidden'); }
  else { teacherFields.classList.remove('hidden'); studentFields.classList.add('hidden'); }
}
</script>
{% endblock %}
