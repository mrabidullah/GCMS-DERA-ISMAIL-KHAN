{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-16 bg-gray-50">
  <div class="max-w-md w-full mx-auto px-4">
    <div class="bg-white rounded-3xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-navy-800 mb-6 flex items-center gap-2"><i class="fas fa-key text-yellow-400"></i> Change Password</h1>
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">Current Password</label><input type="password" name="old_password" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition"></div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">New Password</label><input type="password" name="new_password" required minlength="8" class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition"></div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">Confirm New Password</label><input type="password" name="confirm_password" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition"></div>
        <button type="submit" class="w-full py-3 gradient-navy text-white font-bold rounded-xl hover:opacity-90 transition">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
