{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-navy-900 via-navy-800 to-navy-700 flex items-center justify-center py-16 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-20 h-20 gradient-gold rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl">
        <span class="text-navy-900 font-bold text-2xl">GCMS</span>
      </div>
      <h1 class="text-white font-bold text-3xl">Welcome Back</h1>
      <p class="text-gray-400 mt-2">Sign in to your GCMS account</p>
    </div>
    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-user mr-2 text-navy-600"></i>Username</label>
          <input type="text" name="username" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Enter your username">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-lock mr-2 text-navy-600"></i>Password</label>
          <div class="relative">
            <input type="password" id="password-field" name="password" required class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-navy-500 focus:outline-none transition" placeholder="Enter your password">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"><i class="fas fa-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 gradient-navy text-white font-bold rounded-xl hover:opacity-90 transition-all transform hover:-translate-y-0.5 shadow-lg text-sm">
          <i class="fas fa-sign-in-alt mr-2"></i>Sign In
        </button>
      </form>
      <div class="border-t border-gray-100 mt-6 pt-6 text-center space-y-3">
        <p class="text-sm text-gray-600">Don't have an account? <a href="{% url 'register' %}" class="text-navy-600 font-semibold hover:text-navy-800 transition">Register Here</a></p>
        <p class="text-xs text-gray-400"><i class="fas fa-info-circle mr-1"></i>New registrations require admin approval before login.</p>
      </div>
    </div>
  </div>
</div>
<script>
function togglePassword() {
  const field = document.getElementById('password-field');
  const icon = document.getElementById('eye-icon');
  if(field.type === 'password') { field.type = 'text'; icon.className = 'fas fa-eye-slash'; }
  else { field.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
{% endblock %}
