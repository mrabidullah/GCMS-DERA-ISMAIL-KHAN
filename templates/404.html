{% extends 'base.html' %}
{% block content %}

    <div class="text-9xl font-black text-yellow-400 opacity-30 mb-4">404</div>

    <p class="text-gray-300 text-lg mb-8 max-w-md mx-auto">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex flex-wrap gap-4 justify-center">
      <a href="{% url 'home' %}" class="px-8 py-4 bg-yellow-400 text-navy-900 font-bold rounded-xl hover:bg-yellow-300 transition shadow-lg"><i class="fas fa-home mr-2"></i> Back to Home</a>
      <a href="{% url 'contact' %}" class="px-8 py-4 border-2 border-white text-white font-semibold rounded-xl hover:bg-white hover:text-navy-800 transition"><i class="fas fa-envelope mr-2"></i> Contact Us</a>

  </div>
</div>
